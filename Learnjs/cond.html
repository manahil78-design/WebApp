<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning js</title>
</head>
<body id="main">
    <input type="number" id="box" placeholder="Enter a number">
    <button onclick="checkNum()">Click Here</button>
    <p id="msg"></p>

    <script>
        function checkNum() 
        {
            let val=document.getElementById("box").value;
            if (val>10) 
            {
                document.getElementById("msg").innerText = "Number is greater than 10";
                document.getElementById("msg").style.color = "green";
                document.getElementById("main").style.backgroundColor = "lightgreen";
            } 
            else if (val<10 && val>0) 
            {
                document.getElementById("msg").textContent = "Number is less than 10";
                document.getElementById("msg").style.color = "blue";
                document.getElementById("main").style.backgroundColor = "lightblue";
            } 
            else{
                alert("Invalid or zero input!");
            }
        }
    </script>
</body>
</html>
